<div class='container'>
    <h2>Gerenciamento de Marcas</h2>

    <div *ngIf="mensagemErro" class="error-banner">{{mensagemErro}}</div>

    <div class="form-group">
        <input
        type="text" 
        [(ngModel)]="nomeMarca" 
        placeholder="Nome da Marca"/>
        <button (click)="salvar()">{{marcaEmEdicao ? 'Atualizar' : 'Cadastrar'}}</button>
        <button *ngIf="marcaEmEdicao" (click)="cancelarEdicao()">Cancelar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let marca of marcas">
                <td>{{marca.id}}</td>
                <td>{{marca.nome}}</td>
                <td>
                    <button (click)="editar(marca)">Editar</button>
                    <button (click)="deletar(marca.id)">Excluir</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
