<div class="container">
    <h2>Gerenciamento de Modelos</h2>

    <div *ngIf="mensagemErro" class="error-banner">{{mensagemErro}}</div>

    <div class="form-group">
        <input
        type="text"
        [(ngModel)]="nomeModelo"
        placeholder="Nome do Modelo"
        />

        <select [(ngModel)]="marcaIdSelecionada">
            <option [ngValue]="null">Selecione uma marca</option>
            <option *ngFor="let marca of marcas" [ngValue]="marca.id">{{marca.nome}}</option>
        </select>

        <button (click)="salvar()">{{modeloEmEdicao ? 'Atualizar' : 'Cadastrar'}}</button>
        <button *ngIf="modeloEmEdicao" (click)="cancelarEdicao()">Cancelar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Marca</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let m of modelos">
                    <td>{{m.id}}</td>
                    <td>{{m.nome}}</td>
                    <td>{{getMarcaNome(m.marca)}}</td>
                    <td>
                        <button (click)="editar(m)">Editar</button>
                        <button (click)="deletar(m.id)">Excluir</button>
                    </td>
                </tr>
                
            </tbody>
        </table>
        </div>
